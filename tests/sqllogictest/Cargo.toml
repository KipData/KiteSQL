[package]
name    = "sqllogictest-test"
version = "0.4.0"
edition = "2021"
default-run = "sqllogictest-test"

[features]
default = ["lmdb"]
lmdb    = ["kite_sql/lmdb"]
# Runs the suite through KiteSQL's async path, over a memory storage whose reads suspend.
async   = ["kite_sql/async", "dep:async-trait"]

[[bin]]
name              = "sqlite"
path              = "src/bin/sqlite.rs"
required-features = ["lmdb"]

[dependencies]
async-trait     = { version = "0.1", optional = true }
clap            = { version = "4" }
"kite_sql"      = { path = "../..", default-features = false, features = ["copy", "decimal", "macros", "orm", "parser", "spill", "time"] }
kite_sql_serde_macros = { path = "../../kite_sql_serde_macros" }
glob            = { version = "0.3" }
sqllogictest    = { version = "0.29.1" }
tempfile        = { version = "3.10" }
